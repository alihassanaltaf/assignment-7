<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>merging tables</title>
</head>
<body>
    <table border="1">
        <caption>product price list</caption>
        <tr>
            <th rowspan="2">category</th>
            <th rowspan="2">product name</th>
            <th colspan="2">price</th>
        </tr>
        <tr>
            <th>wholesale</th>
            <th>retail</th>
        </tr>
        <tr>
            <td rowspan="2">electronics</td>
            <td>mobilephone</td>
            <td>25000</td>
            <td>28000</td>
        </tr>
        <tr>
            <td>laptop</td>
            <td>80000</td>
            <td>90000</td>
        </tr>
        <tr>
            <td rowspan="2">furniture</td>
            <td>chair</td>
            <td>2000</td>
            <td>2500</td>
        </tr>
        <tr>
            <td>table</td>
            <td>4000</td>
            <td>5000</td>
        </tr>
        





    </table>
</body>
</html>
